name: Update Compras UY

on:
  workflow_dispatch:
  schedule:
    # 07:30 hora Argentina / Uruguay
    - cron: "30 10 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run extractor with retries
        shell: bash
        run: |
          set +e

          MAX_ATTEMPTS=3
          WAIT_SECONDS=600

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "========================================"
            echo "EJECUCION COMPLETA $attempt/$MAX_ATTEMPTS"
            echo "========================================"

            python extractor.py
            EXIT_CODE=$?

            if [ $EXIT_CODE -eq 0 ]; then
              echo "Extractor completado correctamente."
              exit 0
            fi

            if [ $attempt -lt $MAX_ATTEMPTS ]; then
              echo ""
              echo "El extractor fallo."
              echo "Se conserva el ultimo snapshot valido."
              echo "Esperando 10 minutos antes de reintentar..."
              sleep $WAIT_SECONDS
            fi
          done

          echo ""
          echo "El extractor fallo en los $MAX_ATTEMPTS intentos."
          exit 1

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest.json latest.csv metadata.json

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
          else
            git commit -m "Update Compras UY snapshot"
            git push
          fi
